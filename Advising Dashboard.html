:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#dde1e7;--acc:#0f6b66;--warn:#b45309;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151b;--card:#18202a;--ink:#e8ecf1;--mut:#9aa6b5;--line:#2a3541;--acc:#4fc3bb;--warn:#f0a35a;--bad:#f28b82}}
:root[data-theme=dark]{--bg:#10151b;--card:#18202a;--ink:#e8ecf1;--mut:#9aa6b5;--line:#2a3541;--acc:#4fc3bb;--warn:#f0a35a;--bad:#f28b82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{padding:20px 24px 0;max-width:1100px;margin:auto}h1{font:600 26px Georgia,serif;margin:0}header p{color:var(--mut);margin:4px 0 14px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}nav button{background:none;border:0;padding:10px 16px;color:var(--mut);font:inherit;cursor:pointer;border-bottom:3px solid transparent}nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:auto;padding:20px 24px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.k{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.k b{display:block;font:600 28px Georgia,serif}.k span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}.p{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}.p h3{margin:0 0 10px;font-size:15px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.bar i{display:block;height:14px;background:var(--acc);border-radius:2px}.bar em{font-style:normal;color:var(--mut);text-align:right}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}input{flex:1;min-width:180px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;cursor:pointer}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}
.prof{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:12px}.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--acc)}
.note{color:var(--mut);font-size:13px;margin-top:14px}a.b{color:var(--acc);cursor:pointer;text-decoration:underline}
</style></head><body>

$('t').innerHTML=`<div class="tw"><table><tr>${H.map(([k,l])=>`<th onclick="sort=['${k}',sort[0]=='${k}'?-sort[1]:1];tbl()">${l}</th>`).join('')}<th>Flags</th></tr>${r.slice(0,100).map(s=>`<tr class="r" onclick="sel=D.find(x=>x.id=='${s.id}');go()"><td>${s.id}<td>${s.name}<td>${s.major}<td>${s.gpa.toFixed(2)}<td>${s.st}<td>${s.rem}<td>${tg(s)}</tr>`).join('')}</table></div><p class="note">${r.length} match${r.length==1?'':'es'}${r.length>100?' (showing first 100)':''}.</p>`}
function que(){if(sel)return M.innerHTML=prof(sel);const r=D.filter(s=>s.pri>0).sort((a,b)=>b.pri-a.pri||a.gpa-b.gpa);
M.innerHTML=`<div class="tools"><button onclick="csv()" style="padding:8px 14px">Copy CSV</button><span style="align-self:center;color:var(--mut)">${r.length} students with at least one flag</span></div><div class="tw"><table><tr><th>Score<th>Student<th>Major<th>GPA<th>Reasons</tr>${r.slice(0,100).map(s=>`<tr class="r" onclick="sel=D.find(x=>x.id=='${s.id}');go()"><td>${s.pri}<td>${s.name} (${s.id})<td>${s.major}<td>${s.gpa.toFixed(2)}<td>${tg(s)}</tr>`).join('')}</table></div>
<p class="note">Score is transparent: GPA&lt;2.0 = 3, GPA&lt;2.5 = 2, follow-up flag = 2, +1 per open follow-up, near-graduation with no sessions = 2. Review each case as a person, not a number.</p>`}
function csv(){const r=D.filter(s=>s.pri>0).sort((a,b)=>b.pri-a.pri);const t='id,name,major,gpa,score,reasons\n'+r.map(s=>[s.id,s.name,s.major,s.gpa,s.pri,'"'+s.why.join('; ')+'"'].join(',')).join('\n');
navigator.clipboard.writeText(t).then(()=>alert('Queue copied. Paste into a spreadsheet.'),()=>alert('Copy was blocked by the browser.'))}
go();
</script></body></html>
